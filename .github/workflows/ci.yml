# Mesmo ponto de verificação local e na CI; a publicação depende de autorização explícita.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Instalar navegadores de teste
        run: pnpm exec playwright install --with-deps
      - name: Ferramentas do harness
        run: |
          shellcheck --version
          jq --version
      - name: Verificação completa
        run: scripts/verify.sh --full
